name: Approval integrity gate (demo)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secure-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          package: "."
          path: examples/secure_payment_agent

  vulnerable-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          package: "."
          path: examples/vulnerable_payment_agent
      - name: The vulnerable example must be caught
        if: steps.gate.outcome != 'failure'
        run: |
          echo "::error::vulnerable_payment_agent passed the gate; the testkit missed a bug"
          exit 1
